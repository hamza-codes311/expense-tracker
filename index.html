
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <div>
                <h1>Expense Tracker</h1>
                <p>Manage your money smartly.</p>
            </div>
            <div id="date"></div>
        </header>

        <section class="balance-card">
            <p>Total Balance</p>
            <h1 id="balance">Rs. 0</h1>

            <div class="progress">
                <div id="progressBar"></div>
            </div>

            <small>Income and expenses overview</small>
        </section>

        <section class="summary">

            <div class="card income">
                <div class="icon">↗</div>
                <p>Total Income</p>
                <h2 id="totalIncome">Rs. 0</h2>
            </div>

            <div class="card expense">
                <div class="icon">↘</div>
                <p>Total Expenses</p>
                <h2 id="totalExpense">Rs. 0</h2>
            </div>

        </section>

        <section class="main-content">

            <div class="form-section">
                <h2>Add Transaction</h2>

                <label>Transaction Name</label>
                <input type="text" id="title" placeholder="e.g. Salary, Food">

                <label>Amount</label>
                <input type="number" id="amount" placeholder="Enter amount">

                <label>Transaction Type</label>
                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <button type="button" id="addBtn">+ Add Transaction</button>

                <p id="message"></p>
            </div>

            <div class="transactions">
                <h2>Recent Transactions</h2>

                <div id="transactionList">
                    <p class="empty">No transactions yet.</p>
                </div>
            </div>

        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
